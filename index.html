<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shubharambh Jewellers – Today's Rates</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f9f4ef;
      color: #2d1b1b;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 48px;
      overflow-x: hidden;
    }

    /* ── Animation canvas ── */
    #sparkle-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* animated warm gradient body */
    body { background: #f5ede2; }

    @keyframes bg-breathe {
      0%,100% { background: #f5ede2; }
      50%      { background: #f0e6d4; }
    }

    /* ── Top banner ── */
    .banner {
      width: 100%;
      background: linear-gradient(135deg, #4a0f2e 0%, #6b1a42 60%, #4a0f2e 100%);
      padding: 36px 24px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg, transparent, transparent 18px,
        rgba(201,168,76,0.05) 18px, rgba(201,168,76,0.05) 19px
      );
    }

    .logo-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 18px;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 0 3px #c9a84c, 0 0 24px rgba(201,168,76,0.4);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 3px #c9a84c, 0 0 24px rgba(201,168,76,0.3); }
      50%       { box-shadow: 0 0 0 3px #c9a84c, 0 0 40px rgba(201,168,76,0.7); }
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .banner h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #c9a84c;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      animation: fade-down 0.8s ease both;
    }

    .banner .sub {
      font-size: 0.78rem;
      color: #e8d4b0;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 4px;
      position: relative;
      z-index: 1;
      animation: fade-down 0.9s ease both;
    }

    .gold-line {
      width: 0;
      height: 2px;
      background: #c9a84c;
      margin: 12px auto 8px;
      position: relative;
      z-index: 1;
      animation: expand-line 1s ease 0.5s forwards;
    }

    @keyframes expand-line {
      to { width: 80px; }
    }

    .banner .contact {
      font-size: 0.88rem;
      color: #e8d4b0;
      letter-spacing: 0.06em;
      margin-top: 6px;
      position: relative;
      z-index: 1;
      animation: fade-down 1s ease both;
    }

    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Date strip ── */
    .date-strip {
      background: #fff8f0;
      width: 100%;
      text-align: center;
      padding: 10px;
      font-size: 0.82rem;
      color: #7a4a4a;
      border-bottom: 1px solid #e8d4c0;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }

    /* ── Section title ── */
    .section-title {
      margin: 36px 0 20px;
      text-align: center;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #9a6a6a;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 860px;
      padding: 0 16px;
      position: relative;
      z-index: 1;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dcc8b0;
    }

    /* ── Rates grid ── */
    .rates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 860px;
      padding: 0 16px;
      position: relative;
      z-index: 1;
    }

    /* card entrance */
    .rate-card {
      background: #fff;
      border: 1px solid #e8d8c8;
      border-top: 3px solid #c9a84c;
      border-radius: 10px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(100,40,40,0.06);
      cursor: default;
      opacity: 0;
      transform: translateY(30px);
      transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .rate-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* shimmer sweep on hover */
    .rate-card::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, transparent 30%, rgba(201,168,76,0.15) 50%, transparent 70%);
      transition: left 0.5s ease;
      pointer-events: none;
    }

    .rate-card:hover::after { left: 160%; }

    .rate-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(100,40,40,0.14);
    }

    .rate-card .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #9a6a6a;
      margin-bottom: 12px;
    }

    .rate-card .price {
      font-size: 2rem;
      font-weight: 700;
      color: #3a1010;
      font-variant-numeric: tabular-nums;
    }

    .rate-card .unit {
      font-size: 0.72rem;
      color: #b08080;
      margin-top: 6px;
    }

    /* silver */
    .silver-card { border-top-color: #a0a0a0; }
    .silver-card .price { color: #3a3a3a; }

    /* ── Footer ── */
    .footer {
      margin-top: 40px;
      text-align: center;
      padding: 0 16px;
      position: relative;
      z-index: 1;
    }

    .last-updated { font-size: 0.75rem; color: #b08080; }
    .last-updated span { color: #7a4a4a; font-weight: 600; }

    .shop-note { margin-top: 8px; font-size: 0.72rem; color: #c0a090; }

    .error-msg {
      color: #c0392b;
      font-size: 0.85rem;
      margin-top: 20px;
      background: #fdeaea;
      padding: 12px 20px;
      border-radius: 8px;
    }

    .loading {
      color: #9a6a6a;
      font-size: 0.95rem;
      padding: 40px;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Sparkle canvas sits behind everything -->
  <canvas id="sparkle-canvas"></canvas>

  <div class="banner">
    <div class="logo-ring"><img src="logo.png" alt="Shubharambh Jewellers" /></div>
    <h1>Shubharambh Jewellers</h1>
    <p class="sub">Chikodi</p>
    <div class="gold-line"></div>
    <p class="contact">📞 +91 82084 48787</p>
  </div>

  <div class="date-strip" id="date-display">—</div>

  <div class="section-title">Gold Rates</div>
  <div id="gold-container" class="loading">Fetching rates…</div>

  <div class="section-title" id="silver-section-title" style="display:none">Silver Rates</div>
  <div id="silver-container" class="rates-grid" style="display:none"></div>

  <div class="footer">
    <p class="last-updated">Rates updated at: <span id="last-updated">—</span></p>
    <p class="shop-note">Rates are indicative. Contact shop for final pricing.</p>
    <p id="error-msg" class="error-msg" style="display:none"></p>
  </div>

  <script>
    // ─── CONFIGURATION ────────────────────────────────────────────────────────
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTYOGr5er1W8Qq2m3PVwc2fcMficl0vWS2G1Kawp9QB7lr2N2MbsVT3CHs3HF0YB2NyqH7ZAMcZqgrA/pub?gid=0&single=true&output=csv";
    const REFRESH_INTERVAL = 300000;
    // ─────────────────────────────────────────────────────────────────────────

    // ── Multi-layer animation system ─────────────────────────────────────────
    (function () {
      const canvas = document.getElementById("sparkle-canvas");
      const ctx    = canvas.getContext("2d");
      let W, H;

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      const TAU = Math.PI * 2;

      // ── Layer 1: gold dust (80 glowing orbs) ──
      const dust = Array.from({ length: 80 }, () => spawnDust());
      function spawnDust(fromBottom) {
        return {
          x: Math.random() * (W || 800),
          y: fromBottom ? (H || 800) + 5 : Math.random() * (H || 800),
          r: Math.random() * 3 + 1,
          vx: (Math.random() - 0.5) * 0.4,
          vy: -(Math.random() * 0.6 + 0.2),
          phase: Math.random() * TAU,
          speed: Math.random() * 0.03 + 0.015,
        };
      }

      // ── Layer 2: bright 4-point sparkle stars (40) ──
      const stars = Array.from({ length: 40 }, () => spawnStar());
      function spawnStar(fromBottom) {
        return {
          x: Math.random() * (W || 800),
          y: fromBottom ? (H || 800) + 10 : Math.random() * (H || 800),
          r: Math.random() * 6 + 3,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -(Math.random() * 0.5 + 0.1),
          phase: Math.random() * TAU,
          speed: Math.random() * 0.04 + 0.02,
          rot: Math.random() * TAU,
          drot: (Math.random() - 0.5) * 0.05,
        };
      }

      // ── Layer 3: large drifting diamonds (12) ──
      const diamonds = Array.from({ length: 12 }, () => spawnDiamond());
      function spawnDiamond(fromBottom) {
        return {
          x: Math.random() * (W || 800),
          y: fromBottom ? (H || 800) + 20 : Math.random() * (H || 800),
          size: Math.random() * 18 + 10,
          vx: (Math.random() - 0.5) * 0.2,
          vy: -(Math.random() * 0.3 + 0.06),
          rot: Math.random() * TAU,
          drot: (Math.random() - 0.5) * 0.018,
          phase: Math.random() * TAU,
          speed: Math.random() * 0.012 + 0.006,
        };
      }

      let waveOffset = 0;

      function drawStar4(x, y, r, rot) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a   = rot + (i * TAU) / 8;
          const rad = i % 2 === 0 ? r : r * 0.3;
          i === 0
            ? ctx.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad)
            : ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawDiamond(x, y, size, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(size * 0.55, 0);
        ctx.lineTo(0, size);
        ctx.lineTo(-size * 0.55, 0);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      function tick() {
        ctx.clearRect(0, 0, W, H);

        // shimmer wave bands
        waveOffset += 0.005;
        for (let i = 0; i < 4; i++) {
          const y = H * (0.15 + i * 0.22) + Math.sin(waveOffset + i * 1.5) * 80;
          const g = ctx.createLinearGradient(0, y - 60, 0, y + 60);
          g.addColorStop(0,   "rgba(201,168,76,0)");
          g.addColorStop(0.5, "rgba(201,168,76,0.07)");
          g.addColorStop(1,   "rgba(201,168,76,0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, y - 60, W, 120);
        }

        // dust orbs with glow
        dust.forEach(p => {
          p.phase += p.speed;
          p.x += p.vx + Math.sin(p.phase * 0.6) * 0.25;
          p.y += p.vy;
          if (p.y < -8) Object.assign(p, spawnDust(true));
          const a = 0.3 + 0.5 * Math.abs(Math.sin(p.phase));
          // glow
          const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
          glow.addColorStop(0, `rgba(220,185,90,${a})`);
          glow.addColorStop(1, "rgba(220,185,90,0)");
          ctx.globalAlpha = 1;
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 3, 0, TAU);
          ctx.fill();
          // core
          ctx.globalAlpha = a;
          ctx.fillStyle = "#e0c060";
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.fill();
        });

        // sparkle stars
        stars.forEach(p => {
          p.phase += p.speed;
          p.rot   += p.drot;
          p.x += p.vx + Math.sin(p.phase * 0.5) * 0.3;
          p.y += p.vy;
          if (p.y < -12) Object.assign(p, spawnStar(true));
          const a = 0.35 + 0.65 * Math.abs(Math.sin(p.phase));
          // glow halo
          const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
          halo.addColorStop(0, `rgba(230,200,100,${a * 0.5})`);
          halo.addColorStop(1, "rgba(230,200,100,0)");
          ctx.globalAlpha = 1;
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 4, 0, TAU);
          ctx.fill();
          // star shape
          ctx.globalAlpha = a;
          ctx.fillStyle = a > 0.6 ? "#f0d060" : "#c9a84c";
          drawStar4(p.x, p.y, p.r, p.rot);
        });

        // diamonds
        diamonds.forEach(p => {
          p.phase += p.speed;
          p.rot   += p.drot;
          p.x += p.vx + Math.sin(p.phase * 0.4) * 0.25;
          p.y += p.vy;
          if (p.y < -35) Object.assign(p, spawnDiamond(true));
          const a = 0.2 + 0.35 * Math.abs(Math.sin(p.phase));
          ctx.globalAlpha = a;
          ctx.strokeStyle = "#b87a50";
          ctx.lineWidth = 1.2;
          drawDiamond(p.x, p.y, p.size, p.rot);
        });

        ctx.globalAlpha = 1;
        requestAnimationFrame(tick);
      }
      tick();

      // click burst
      document.addEventListener("click", e => {
        for (let i = 0; i < 14; i++) {
          const p = spawnStar();
          p.x  = e.clientX;
          p.y  = e.clientY;
          p.r  = Math.random() * 5 + 2;
          p.vx = (Math.random() - 0.5) * 5;
          p.vy = (Math.random() - 0.5) * 5 - 1;
          p.phase = 0;
          stars.push(p);
        }
        while (stars.length > 60) stars.shift();
      });
    })();

    // ── Count-up animation ────────────────────────────────────────────────────
    function countUp(el, target, duration = 900) {
      const start = Date.now();
      const tick = () => {
        const progress = Math.min((Date.now() - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(eased * target);
        el.textContent = "₹" + current.toLocaleString("en-IN");
        if (progress < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    // ── Staggered card entrance ───────────────────────────────────────────────
    function animateCards(container) {
      const cards = container.querySelectorAll(".rate-card");
      cards.forEach((card, i) => {
        setTimeout(() => card.classList.add("visible"), i * 120);
        const priceEl = card.querySelector(".price");
        const raw = Number(priceEl.dataset.value);
        if (raw) setTimeout(() => countUp(priceEl, raw, 800), i * 120 + 100);
      });
    }

    // ── CSV / fetch ───────────────────────────────────────────────────────────
    function rawNumber(value) {
      return Number(String(value).replace(/,/g, ""));
    }

    function formatINR(value) {
      return "₹" + rawNumber(value).toLocaleString("en-IN");
    }

    function parseCSV(text) {
      return text.trim().split("\n").map(row => {
        const cells = [];
        let current = "", inQuotes = false;
        for (const ch of row) {
          if (ch === '"') { inQuotes = !inQuotes; }
          else if (ch === ',' && !inQuotes) { cells.push(current.trim()); current = ""; }
          else { current += ch; }
        }
        cells.push(current.trim());
        return cells;
      });
    }

    function buildCard(row, issilver = false) {
      const [item, rate, unit] = row;
      const num = rawNumber(rate);
      return `
        <div class="rate-card${issilver ? " silver-card" : ""}">
          <div class="label">${item}</div>
          <div class="price" data-value="${num}">₹0</div>
          <div class="unit">${unit || "per gram"}</div>
        </div>`;
    }

    async function fetchRates() {
      try {
        const res = await fetch(SHEET_URL + "&t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("Network error");

        const text = await res.text();
        const rows = parseCSV(text).slice(1).filter(r => r.length >= 3 && r[0]);

        const goldRows   = rows.filter(r => !r[0].toLowerCase().includes("silver"));
        const silverRows = rows.filter(r =>  r[0].toLowerCase().includes("silver"));

        const goldEl = document.getElementById("gold-container");
        goldEl.className = "rates-grid";
        goldEl.innerHTML = goldRows.map(r => buildCard(r, false)).join("");
        animateCards(goldEl);

        if (silverRows.length) {
          document.getElementById("silver-section-title").style.display = "flex";
          const silverEl = document.getElementById("silver-container");
          silverEl.style.display = "grid";
          silverEl.innerHTML = silverRows.map(r => buildCard(r, true)).join("");
          animateCards(silverEl);
        }

        document.getElementById("last-updated").textContent =
          new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
        document.getElementById("error-msg").style.display = "none";

      } catch (err) {
        document.getElementById("gold-container").innerHTML = "";
        document.getElementById("gold-container").className = "";
        const errEl = document.getElementById("error-msg");
        errEl.style.display = "block";
        errEl.textContent = "Could not load rates. Please check Sheet ID and publication settings.";
      }
    }

    document.getElementById("date-display").textContent =
      new Date().toLocaleDateString("en-IN", {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
      });

    fetchRates();
    setInterval(fetchRates, REFRESH_INTERVAL);
  </script>

</body>
</html>
